name: CI

on:
  push:
    branches: [main, retry-connection]
  pull_request:
    branches: [main, retry-connection]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra dev --extra proto
      - name: Lockfile is up to date
        run: uv lock --check
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Pyright
        run: uv run --no-sync pyright
      - name: Proto modules are up to date
        run: uv run --no-sync python scripts/generate_proto_stubs.py --check
      - name: Audit runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt |
            grep -v ' @ git+' > /tmp/req.txt
          uvx pip-audit -r /tmp/req.txt

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra dev
      - name: Test
        run: uv run --no-sync pytest -m "not premium"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Build
        run: uv build
